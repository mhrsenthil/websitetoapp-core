name: Build Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"
      app_name:
        description: "App name"
        required: true
        default: "Website App"
      package_name:
        description: "Android package name"
        required: true
        default: "com.example.websiteapp"
      version_name:
        description: "Version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK and AAB
        run: |
          gradle --no-daemon \
            -PWEB_URL="${{ inputs.website_url }}" \
            -PAPP_NAME="${{ inputs.app_name }}" \
            -PPACKAGE_NAME="${{ inputs.package_name }}" \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}" \
            assembleRelease bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: website-to-app-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
